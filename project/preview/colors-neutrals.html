<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:0;background:var(--loam-black);color:#fff;}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:0;}
.sw{padding:18px 14px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--loam-charcoal);}
.sw:last-child{border-right:0;}
.name{font-family:var(--font-narrow);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.1em;}
.hex{font-family:var(--font-mono);font-size:11px;}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--loam-ash);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#0A0A0A;"><div><div class="name">BLACK</div><div class="tok">--loam-black</div></div><div class="hex">#0A0A0A</div></div>
  <div class="sw" style="background:#1A1A1A;"><div><div class="name">OFF-BLACK</div><div class="tok">--loam-off-black</div></div><div class="hex">#1A1A1A</div></div>
  <div class="sw" style="background:#2E2E2E;"><div><div class="name">CHARCOAL</div><div class="tok">--loam-charcoal</div></div><div class="hex">#2E2E2E</div></div>
  <div class="sw" style="background:#5A5A5A;"><div><div class="name">GRAPHITE</div><div class="tok">--loam-graphite</div></div><div class="hex">#5A5A5A</div></div>
  <div class="sw" style="background:#9A9A9A;color:#0A0A0A;"><div><div class="name">ASH</div><div class="tok" style="color:#3a3a3a;">--loam-ash</div></div><div class="hex">#9A9A9A</div></div>
  <div class="sw" style="background:#E8E6E1;color:#0A0A0A;"><div><div class="name">BONE</div><div class="tok" style="color:#5a5a5a;">--loam-bone</div></div><div class="hex">#E8E6E1</div></div>
</div>
</body></html>
