<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--loam-black);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.spec{display:flex;align-items:center;gap:14px;padding:14px;background:#1A1A1A;}
.lbl{font-family:var(--font-narrow);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.16em;color:var(--loam-ash);min-width:80px;}
.val{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.chip{display:inline-block;padding:5px 9px;background:#DAEE01;color:#0A0A0A;font-family:var(--font-mono);font-weight:700;font-size:10px;letter-spacing:.1em;}
.row{display:flex;align-items:center;gap:10px;}
</style></head><body>
<div class="spec"><div class="lbl">FABRIC</div><div class="val">200gsm Recycled Poly</div></div>
<div class="spec"><div class="lbl">FIT</div><div class="val">Race / Trail / Box</div></div>
<div class="spec"><div class="lbl">SIZES</div><div class="row"><span class="chip">XS</span><span class="chip">S</span><span class="chip">M</span><span class="chip">L</span><span class="chip">XL</span></div></div>
<div class="spec"><div class="lbl">SHIPS</div><div class="val">Free UK over £80 · 2 days</div></div>
</body></html>
