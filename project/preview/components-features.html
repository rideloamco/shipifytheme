<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:30px 28px;background:var(--loam-black);color:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:0;}
.cell{padding:8px 18px 8px 0;border-right:1px solid var(--loam-charcoal);}
.cell:last-child{border-right:0;}
.num{font-family:var(--font-display);font-size:64px;line-height:.9;color:#DAEE01;letter-spacing:.02em;}
.title{font-family:var(--font-narrow);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.16em;margin-top:10px;}
.desc{font-family:var(--font-body);font-size:12px;color:var(--loam-ash);margin-top:6px;line-height:1.45;}
</style></head><body>
<div class="cell"><div class="num">01</div><div class="title">TRAIL-TESTED</div><div class="desc">Ridden hard in mud, rain, and dust before it ever ships.</div></div>
<div class="cell"><div class="num">02</div><div class="title">BREATHABLE</div><div class="desc">Engineered fabrics for long days on the climbs.</div></div>
<div class="cell"><div class="num">03</div><div class="title">UK-BUILT</div><div class="desc">Designed and stress-tested in the Tweed Valley.</div></div>
<div class="cell"><div class="num">04</div><div class="title">FAIR PRICED</div><div class="desc">No prestige tax. No logo markup. Half the RRP.</div></div>
</body></html>
