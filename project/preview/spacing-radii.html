<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:0;background:var(--loam-black);color:#fff;font-family:var(--font-mono);font-size:11px;overflow:hidden;}
.row{display:flex;align-items:flex-end;gap:14px;padding:24px;border-bottom:1px solid var(--loam-charcoal);}
.sp{background:var(--loam-neon);width:10px;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-weight:700;}
.label{margin-top:6px;color:var(--loam-ash);text-align:center;}
.cell{display:flex;flex-direction:column;align-items:center;}
.r{display:flex;gap:18px;padding:18px 24px;}
.rb{width:60px;height:60px;background:var(--loam-off-black);border:2px solid #fff;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.rb b{font-family:var(--font-display);font-size:18px;}
.rb span{font-size:9px;color:var(--loam-ash);}
</style></head><body>
<div class="row">
  <div class="cell"><div class="sp" style="height:4px;"></div><div class="label">4</div></div>
  <div class="cell"><div class="sp" style="height:8px;"></div><div class="label">8</div></div>
  <div class="cell"><div class="sp" style="height:12px;"></div><div class="label">12</div></div>
  <div class="cell"><div class="sp" style="height:16px;"></div><div class="label">16</div></div>
  <div class="cell"><div class="sp" style="height:24px;"></div><div class="label">24</div></div>
  <div class="cell"><div class="sp" style="height:32px;"></div><div class="label">32</div></div>
  <div class="cell"><div class="sp" style="height:48px;"></div><div class="label">48</div></div>
  <div class="cell"><div class="sp" style="height:64px;"></div><div class="label">64</div></div>
  <div class="cell"><div class="sp" style="height:96px;"></div><div class="label">96</div></div>
</div>
<div class="r">
  <div class="rb" style="border-radius:0;"><b>0</b><span>HARD</span></div>
  <div class="rb" style="border-radius:2px;"><b>2</b><span>TAGS</span></div>
  <div class="rb" style="border-radius:4px;"><b>4</b><span>RARE</span></div>
  <div class="rb" style="border-radius:999px;"><b>∞</b><span>BADGES</span></div>
</div>
</body></html>
