<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--loam-black);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.q{background:#1A1A1A;border-left:6px solid #DAEE01;padding:20px 22px;}
.q .body{font-family:var(--font-body);font-size:15px;line-height:1.45;font-weight:500;}
.q .by{font-family:var(--font-narrow);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.16em;color:var(--loam-ash);margin-top:14px;}
.stars{color:#DAEE01;font-family:var(--font-mono);letter-spacing:.1em;font-size:13px;margin-bottom:10px;}
</style></head><body>
<div class="q">
  <div class="stars">★★★★★</div>
  <div class="body">"Best MTB kit I've owned. Tee keeps me cool on the climbs and the price doesn't mug me off. Sound."</div>
  <div class="by">— TAYLOR · TWEED VALLEY</div>
</div>
<div class="q">
  <div class="stars">★★★★★</div>
  <div class="body">"Durable, breathable, looks the part. Can't argue with that."</div>
  <div class="by">— JORDAN · PEAK DISTRICT</div>
</div>
</body></html>
