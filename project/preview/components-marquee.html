<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;background:var(--loam-black);color:#fff;overflow:hidden;}
.marq{background:#0A0A0A;border-top:2px solid #DAEE01;border-bottom:2px solid #DAEE01;padding:18px 0;overflow:hidden;}
.track{display:flex;gap:48px;white-space:nowrap;animation:scroll 24s linear infinite;}
.track span{font-family:var(--font-display);font-size:42px;text-transform:uppercase;letter-spacing:.04em;color:#DAEE01;}
.dot{color:#fff;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.marq2{background:#DAEE01;color:#0A0A0A;padding:14px 0;overflow:hidden;margin-top:14px;}
.track2{display:flex;gap:36px;white-space:nowrap;animation:scroll 28s linear infinite;}
.track2 span{font-family:var(--font-display);font-size:32px;text-transform:uppercase;letter-spacing:.04em;}
</style></head><body>
<div class="marq"><div class="track">
<span>NO PRESTIGE TAX</span><span class="dot">·</span>
<span>BUILT FOR THE GRAFT</span><span class="dot">·</span>
<span>MUD APPROVED</span><span class="dot">·</span>
<span>NO PRESTIGE TAX</span><span class="dot">·</span>
<span>BUILT FOR THE GRAFT</span><span class="dot">·</span>
<span>MUD APPROVED</span><span class="dot">·</span>
</div></div>
<div class="marq2"><div class="track2">
<span>UK-BUILT</span><span>·</span><span>RIDER-OWNED</span><span>·</span><span>FREE UK SHIPPING OVER £80</span><span>·</span>
<span>UK-BUILT</span><span>·</span><span>RIDER-OWNED</span><span>·</span><span>FREE UK SHIPPING OVER £80</span><span>·</span>
</div></div>
</body></html>
