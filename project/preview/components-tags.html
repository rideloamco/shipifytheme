<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--loam-black);color:#fff;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.tag{font-family:var(--font-mono);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:6px 10px;border:1px solid #fff;background:transparent;}
.tag-neon{background:#DAEE01;color:#0A0A0A;border-color:#DAEE01;}
.tag-fill{background:#fff;color:#0A0A0A;border-color:#fff;}
.tag-warn{border-color:#DAEE01;color:#DAEE01;}
.bbeb{font-family:var(--font-display);font-size:18px;letter-spacing:.04em;padding:4px 10px 1px;}
</style></head><body>
<span class="tag tag-neon">NEW</span>
<span class="tag tag-fill">RESTOCKED</span>
<span class="tag tag-warn">LAST SIZES</span>
<span class="tag">UK-BUILT</span>
<span class="tag bbeb tag-neon">£65</span>
<span class="tag" style="text-decoration:line-through;color:var(--loam-graphite);border-color:var(--loam-charcoal);">£180 RRP ELSEWHERE</span>
</body></html>
